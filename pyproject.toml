[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thunder-sandbox"
version = "0.3.0"
description = "Create and control Thunder GPU sandboxes from Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Thunder GPU, Inc.", email = "support@thundercompute.com" },
]
requires-python = ">=3.10"
keywords = ["cloud", "gpu", "sandbox", "thunder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.thundercompute.com"
Repository = "https://github.com/Thunder-Compute/thunder-sandbox"
Issues = "https://github.com/Thunder-Compute/thunder-sandbox/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["thunder", "thunder_sandbox"]

[tool.setuptools.package-data]
thunder = ["py.typed"]
thunder_sandbox = ["py.typed"]
