name: Build package

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run the unit test suite before building
        required: false
        type: boolean
        default: false
      verify-tag:
        description: Verify that the pushed tag matches the package version
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Verify tag matches package version
        if: inputs.verify-tag
        run: python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; tag = os.environ['GITHUB_REF_NAME']; assert tag == f'v{version}', f'tag {tag!r} does not match package version {version!r}'"

      - name: Install package and dependencies
        if: inputs.run-tests
        run: python -m pip install -e .

      - name: Run unit tests
        if: inputs.run-tests
        run: python -m unittest discover -v -s test -p "*_test.py"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Verify installed package
        run: python -I -c "import importlib.metadata as metadata, tomllib; import thunder_sandbox; expected = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert metadata.version('thunder-sandbox') == expected; assert thunder_sandbox.Sandbox.__name__ == 'Sandbox'; assert thunder_sandbox.Client.__name__ == 'Client'; assert thunder_sandbox.Process.__name__ == 'Process'; assert callable(thunder_sandbox.Sandbox.create_async); assert callable(thunder_sandbox.Client.create_sandbox_async); assert callable(thunder_sandbox.Process.wait_async)"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
