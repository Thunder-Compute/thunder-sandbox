// Running processes in, and moving files to and from, one sandbox. Mirrors
// thunder_sandbox/_channels/_spec.py. Sandbox lifecycle stays on the REST API.
//
// Conventions
// - Unset means the documented default. A server that can't honour a set
//   value refuses the whole request; it never ignores a field.
// - Paths, argv and environment values are bytes; NUL is rejected. Paths in
//   the sandbox are absolute.
// - IDs are 32 lowercase hexadecimal characters, generated by the client.
// - Every message stands alone: it names its sandbox, the process or
//   transfer it concerns, and its byte offset, so sending it again, on any
//   connection, has the same effect as sending it once.

syntax = "proto3";

package thunder.sandbox.v1;

// An account in the sandbox, resolved like `docker exec --user`: a named user
// gets its groups from /etc/passwd and /etc/group, and `group` replaces them.
// A name that isn't found is taken as a numeric ID if it is all digits.
// `group` requires `user`. Unset means root.
message Identity {
  oneof user {
    uint32 uid = 1;
    string user_name = 2;
  }
  oneof group {
    uint32 gid = 3;
    string group_name = 4;
  }
}

// ============================================================ exec

// One command, run as executable + args with no shell, in the sandbox's
// environment (a default PATH, HOSTNAME, the image's ENV and the sandbox's
// env), with umask 0o022.
//
// Without a PTY the process has no stdin and survives lost connections; it
// can be found again by exec_id. With a PTY, stdin is the terminal, all
// output arrives on stdout, and the process ends with its connection.
//
// Terminating sends SIGTERM to the process group, then SIGKILL after 5 s.
//
// exec_id makes this idempotent: a repeat with the same exec_id refers to
// the process already started, and a different request under that exec_id
// is refused.
message ExecRequest {
  string sandbox_id = 1;
  string exec_id = 2;
  bytes executable = 3;  // a bare name is looked up in PATH
  repeated bytes args = 4;
  // Default: the image's WORKDIR, else "/".
  optional bytes working_dir = 5;
  // Set on top of the environment. Names are non-empty, without '='.
  map<string, bytes> env = 6;
  // Removed from the environment. Must not share a name with env.
  repeated string unset_env = 7;
  Identity identity = 8;
  OutputMode stdout = 9;
  OutputMode stderr = 10;
  bool pty = 11;  // requires CAPTURE output
}

enum OutputMode {
  OUTPUT_MODE_UNSPECIFIED = 0;  // CAPTURE
  OUTPUT_MODE_CAPTURE = 1;
  OUTPUT_MODE_DISCARD = 2;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

// Asks for a CAPTURE stream's output from offset onward. Answered with
// OutputChunks.
message OutputRequest {
  string sandbox_id = 1;
  string exec_id = 2;
  Stream stream = 3;
  uint64 offset = 4;
}

// Output starting at byte offset of the stream. eof: nothing follows data.
message OutputChunk {
  string exec_id = 1;
  Stream stream = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool eof = 5;
}

// Terminal input, PTY only. Bytes before the server's current offset are
// ignored, and a gap is refused. eof closes stdin.
message InputChunk {
  string sandbox_id = 1;
  string exec_id = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool eof = 5;
}

// Answered with ExecStatus: at once, or once ENDED if wait is set.
message StatusRequest {
  string sandbox_id = 1;
  string exec_id = 2;
  bool wait = 3;
}

// Answered with ExecStatus once ENDED. Ending an ended process is a no-op.
message TerminateRequest {
  string sandbox_id = 1;
  string exec_id = 2;
}

message ExecStatus {
  string exec_id = 1;
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_STARTING = 1;
    STATE_RUNNING = 2;
    STATE_ENDED = 3;
  }
  State state = 2;
  ExitReason reason = 3;  // set when ENDED
  // Set when ENDED, unless INTERRUPTED.
  optional int32 returncode = 4;
}

enum ExitReason {
  EXIT_REASON_UNSPECIFIED = 0;
  // Ended on its own. Killed by signal N reads as 128 + N.
  EXIT_REASON_EXITED = 1;
  // Ended by terminating it: 143 after SIGTERM, 137 after SIGKILL.
  EXIT_REASON_TERMINATED = 2;
  // Stopped without an observed exit (the sandbox restarted, for example).
  EXIT_REASON_INTERRUPTED = 3;
}

// ============================================================ transfers
//
// The destination is the result, unless it is an existing directory, which
// receives the source under its own name. contents_only, which requires a
// directory source, copies its contents into the destination instead
// (`cp src/. dst`).
//
// Fixed rules:
// - A file or a directory, whichever the source is, is transferred.
// - All or nothing: until the transfer completes, the destination is as it
//   was. A transfer that fails or is abandoned never lands.
// - The destination's parent must exist.
// - An existing directory is merged into; a file replaces a file.
// - Symlinks are followed, in the source and at the destination.
// - Files keep their permission bits and modification times.
// - The sandbox side runs as root; what lands there is owned by root.

// The client then sends the contents as TransferChunks. The destination
// changes once the chunk with eof arrives. A repeat with the same
// transfer_id continues that upload; a different request under that
// transfer_id is refused.
message UploadRequest {
  string sandbox_id = 1;
  string transfer_id = 2;
  bytes destination = 3;
  bool contents_only = 4;
}

// Answered with TransferChunks from offset onward. The source is read once
// per transfer_id, so resuming at an offset continues the same contents. A
// request that differs other than in offset under that transfer_id is
// refused.
message DownloadRequest {
  string sandbox_id = 1;
  string transfer_id = 2;
  bytes source = 3;
  bool contents_only = 4;
  uint64 offset = 5;
}

// A transfer's contents, as one tar stream in either direction. Bytes
// before the receiver's current offset are ignored, and a gap is refused.
message TransferChunk {
  string sandbox_id = 1;
  string transfer_id = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool eof = 5;
}
