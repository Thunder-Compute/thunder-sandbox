// The execution channel's requests and results: running processes in, and
// moving files to and from, one sandbox. Mirrors
// thunder_sandbox/_channels/_spec.py. Every field names a behaviour the SDK
// has today; nothing here is a new feature. The service that carries these
// messages isn't defined yet. Sandbox lifecycle (create, terminate, network
// policy) stays on the REST API.
//
// Conventions
// - Unset means "the default": an `optional` scalar that isn't present, an
//   enum at *_UNSPECIFIED (= 0), an unset message, an empty list or map. Each
//   field documents its default. A server that can't honour a set value
//   refuses the whole request; it never ignores a field.
// - Durations are milliseconds; the Python API takes seconds.
// - Paths, argv and environment values are bytes (Linux paths need not be
//   UTF-8). NUL is always rejected. Paths in the sandbox are absolute.
// - IDs are 32 lowercase hexadecimal characters, generated by the client.

syntax = "proto3";

package thunder.sandbox.v1;

// ============================================================ shared

// An account in the sandbox, resolved like `docker exec --user`.
//
// A named user gets its primary group and supplementary groups from the
// sandbox's /etc/passwd and /etc/group; `group` replaces the primary group
// and clears the supplementary ones. `group` requires `user`. Unset means
// root (uid 0, gid 0). A name is looked up as a name first and, failing
// that, taken as a numeric ID if it is all digits, as Docker does.
//
// Privilege follows the uid alone. Root has every capability. Another user
// has none, but nothing sets no_new_privs, so it can still escalate through
// sudo or setuid programs if the image provides them.
message Identity {
  oneof user {
    uint32 uid = 1;
    string user_name = 2;  // no ':'
  }
  oneof group {
    uint32 gid = 3;
    string group_name = 4; // no ':'
  }
}

// ============================================================ image command
// Part of starting a VM sandbox, not of the channel: the backend runs and
// overrides the image command only there. Container sandboxes run the
// image's ENTRYPOINT + CMD once, as root, from its WORKDIR (or /), with no
// override.

message ImageCommand {
  // Overrides as `docker run` does. A non-empty entrypoint replaces the
  // image's and, unless cmd is also non-empty, clears its Cmd. A non-empty
  // cmd replaces only the Cmd. Empty keeps the image's value. (To run only a
  // command, put all of it in entrypoint; to run nothing, use ["true"].)
  repeated bytes entrypoint = 1;
  repeated bytes cmd = 2;
  // Absolute; created if missing. Default: the image's WORKDIR, else "/".
  // Also where exec starts when working_dir is unset.
  optional bytes workdir = 3;
  enum Restart {
    RESTART_UNSPECIFIED = 0;  // NO
    RESTART_NO = 1;           // at most once, even across guest and host reboots
    RESTART_ON_FAILURE = 2;   // again after a nonzero exit, and on every boot
    RESTART_ALWAYS = 3;       // again after any exit, and on every boot
  }
  // Re-runs wait 1 s, doubling to 60 s, and start over after a run that
  // lasted a minute.
  Restart restart = 4;
  // Fixed rules: it runs as root, after the image's own services, with the
  // image ENV overlaid by the sandbox's env, and the sandbox stays up after
  // it exits.
}

// ============================================================ exec

// One command. argv is executable + args; no shell interprets it.
//
// Without a PTY the process has no stdin and is reconnectable: it keeps
// running and its output stays readable across lost connections, and
// it can be found again by exec_id. With a PTY, stdin is the terminal, stdout
// carries all output, stderr is empty, and the process lives only as long as
// the connection that started it.
//
// Terminating a process sends SIGTERM to its whole process group, then
// SIGKILL 5 seconds later if it is still running. It then ends TERMINATED
// with 143 (after SIGTERM) or 137 (after SIGKILL).
message ExecRequest {
  string sandbox_id = 1;
  string exec_id = 2;
  // A bare name is looked up in the process's PATH.
  bytes executable = 3;
  repeated bytes args = 4;
  // Absolute. Default: the image's WORKDIR, else "/" (on a VM sandbox, the
  // image command's workdir).
  optional bytes working_dir = 5;
  // Start from the sandbox's environment: a default PATH, HOSTNAME, the
  // image's ENV and the sandbox's env, with no HOME or USER unless the image
  // sets them. Default: true.
  optional bool inherit_env = 6;
  // Set on top of the inherited environment. Names are non-empty, without
  // '=' or NUL.
  map<string, bytes> env = 7;
  // Removed from the inherited environment. Must not share a name with env.
  repeated string unset_env = 8;
  // Default: root.
  Identity identity = 9;
  // 0 to 0o777. Default: 0o022.
  optional uint32 umask = 10;
  // Default: CAPTURE.
  OutputMode stdout = 11;
  OutputMode stderr = 12;
  // Requires CAPTURE output (or unset) and AUTO retention (or unset).
  optional bool pty = 13;
  // Default: AUTO.
  Retention retention = 14;
}

enum OutputMode {
  OUTPUT_MODE_UNSPECIFIED = 0;
  OUTPUT_MODE_CAPTURE = 1;
  OUTPUT_MODE_DISCARD = 2;
}

enum Retention {
  RETENTION_UNSPECIFIED = 0;
  // Status and captured output are removed once the process has ended and
  // every captured stream has been read to the end.
  RETENTION_AUTO = 1;
  // Kept until cleaned up explicitly.
  RETENTION_RETAIN = 2;
}

// One observation of a process.
message ExecStatus {
  string exec_id = 1;
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_STARTING = 1;
    STATE_RUNNING = 2;
    STATE_ENDED = 3;
  }
  State state = 2;
  // Set exactly when ENDED.
  ExitReason reason = 3;
  // Set exactly when ENDED, unless INTERRUPTED.
  optional int32 returncode = 4;
}

enum ExitReason {
  EXIT_REASON_UNSPECIFIED = 0;
  // Ended on its own. A shell's convention applies: killed by signal N reads
  // as exit code 128 + N.
  EXIT_REASON_EXITED = 1;
  // Terminating it ended it: 143 after SIGTERM, or 137 after the SIGKILL
  // that follows 5 seconds later.
  EXIT_REASON_TERMINATED = 2;
  // It stopped running, but nothing observed how it ended (the sandbox
  // restarted, for example), so there is no exit code.
  EXIT_REASON_INTERRUPTED = 3;
}

// ============================================================ transfers

// How a transfer lands. The destination is the result itself, unless it is
// an existing directory, in which case the source goes inside it under its
// own name. contents_only instead copies a directory's contents into the
// destination directory (the `/.` suffix of cp and scp).
//
// Fixed rules:
// - Nothing appears at the destination until the whole transfer has
//   arrived, and a failure or timeout before then leaves the destination as
//   it was.
// - An existing directory is merged into: what the source has is added or
//   replaced, the rest is kept, and the directory's own mode, owner and
//   modification time become the source directory's. A file replaces a file.
// - Symlinks in the source are followed: what each link points to is copied,
//   and a dangling or looping link fails the transfer. A destination that is
//   a symlink is followed too.
// - The sandbox side reads and writes as root, so permissions there never
//   block a transfer; a read-only filesystem still does.
message TransferOptions {
  // Required when the source is a directory.
  bool recursive = 1;
  // Requires recursive and a directory source.
  bool contents_only = 2;
  // Create missing parent directories of the destination. Default: false;
  // a missing parent fails the transfer.
  optional bool create_parents = 3;
  // Keep the source's modification times. Default: true.
  optional bool preserve_times = 4;
  // The whole operation. Default: no limit.
  optional uint64 timeout_ms = 5;
}

// Uploaded files keep their exact source permission bits, as `docker cp`
// keeps them, whatever the sandbox's umask.
message UploadRequest {
  string sandbox_id = 1;
  bytes destination = 2;  // absolute
  TransferOptions options = 3;
  // Who owns what lands in the sandbox. Default: root (0:0).
  Identity owner = 4;
}

// Downloaded files belong to the local user and keep their source permission
// bits (0o777 only), plus read and write for that user, and execute too on
// directories. Devices, FIFOs and sockets in the source are left out. The
// local side isn't on the wire: the client applies these rules.
message DownloadRequest {
  string sandbox_id = 1;
  bytes source = 2;  // absolute
  TransferOptions options = 3;
}
