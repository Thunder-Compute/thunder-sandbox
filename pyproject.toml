[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thunder-sandbox"
version = "0.0.0"
description = "Python client for Thunder sandboxes"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["thunder"]

[tool.setuptools.package-data]
thunder = ["py.typed"]
