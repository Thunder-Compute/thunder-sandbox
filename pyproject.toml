[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thunder-sandbox"
version = "0.5.0"
description = "Create and control Thunder GPU sandboxes from Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Thunder GPU, Inc.", email = "support@thundercompute.com" },
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "asyncssh>=2.21.1",
]
keywords = ["cloud", "gpu", "sandbox", "thunder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.thundercompute.com"
Repository = "https://github.com/Thunder-Compute/thunder-sandbox"
Issues = "https://github.com/Thunder-Compute/thunder-sandbox/issues"

[tool.setuptools]
packages = [
    "thunder_sandbox",
    "thunder_sandbox._common",
    "thunder_sandbox.asynchronous",
    "thunder_sandbox.synchronous",
]

[tool.setuptools.package-data]
thunder_sandbox = ["py.typed"]
